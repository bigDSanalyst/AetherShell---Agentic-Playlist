# Runs the same checks a contributor runs locally (see CLAUDE.md) on every push
# and pull request. `npm run doctor` is not run here: it checks a deployment
# (keys, charter, ledger), and CI has none, so it would always say BLOCK.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
